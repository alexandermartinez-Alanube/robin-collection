steps:
  - name: "gcr.io/cloud-builders/docker"
    args:
      - "build"
      - "-t"
      - "gcr.io/${PROJECT_ID}/robin-collection:latest"
      - "-f"
      - "google-chat-bot/Dockerfile"
      - "."
  - name: "gcr.io/cloud-builders/docker"
    args:
      - "push"
      - "gcr.io/${PROJECT_ID}/robin-collection:latest"
images:
  - "gcr.io/${PROJECT_ID}/robin-collection:latest"
options:
  logging: CLOUD_LOGGING_ONLY
